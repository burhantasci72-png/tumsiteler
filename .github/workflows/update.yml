name: Spor Listesi Guncelle

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      validate:
        description: 'Yayinlari dogrula (0 = kapat)'
        default: '1'
      keep_unverified:
        description: 'Dogrulanamayanlari da yaz (1 = evet)'
        default: '0'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'core.py'
      - 'sources.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari yukle
        run: pip install --quiet requests beautifulsoup4 urllib3

      - name: Sozdizimi kontrolu
        run: python -m compileall -q core.py sources.py main.py

      - name: Birim testleri
        run: python -m unittest discover -s tests -v

      - name: Listeyi olustur
        id: build
        env:
          VALIDATE: ${{ github.event.inputs.validate || '1' }}
          KEEP_UNVERIFIED: ${{ github.event.inputs.keep_unverified || '0' }}
          PLAYER_PROXY: ${{ vars.PLAYER_PROXY }}
          VALIDATE_WORKERS: '48'
          SCRAPE_WORKERS: '24'
          IMPERSONATE: '1'
        # main.py kaynaklara ulasamazsa 1 doner; bu durumda mevcut liste
        # KORUNUR (bozuk/bos liste asla commit edilmez).
        run: |
          set +e
          python main.py | tee build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Sonucu dogrula
        if: steps.build.outputs.status == '0'
        run: |
          python - <<'EOF'
          import json, sys
          data = json.load(open('channels.json', encoding='utf-8-sig'))
          count = data.get('count', 0)
          print(f"Kanal sayisi: {count}")
          if count < 5:
              print("::error::Cok az kanal uretildi, commit iptal.")
              sys.exit(1)
          EOF

      - name: Kaydet ve yukle
        if: steps.build.outputs.status == '0'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          # NOT: health_report.json .gitignore'da oldugu icin eklenMEZ;
          # git add'in tamamini kirdigi icin liste uzun sure commit edilemedi.
          if ! git add Canli_Spor_Hepsi.m3u channels.json 2>/tmp/add.err; then
            echo "::error::git add basarisiz: $(tail -2 /tmp/add.err)"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "Liste guncellendi: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            || { echo "::error::git commit basarisiz"; exit 1; }
          # Paralel kosulara karsi rebase et, sonra retry'li push
          git pull --rebase origin main 2>/tmp/rebase.err \
            || { echo "::error::rebase basarisiz: $(tail -2 /tmp/rebase.err)"; exit 1; }
          for i in 1 2 3; do
            if git push origin main 2>/tmp/push.err; then
              echo "Push tamam."
              exit 0
            fi
            echo "::warning::Push deneme $i basarisiz: $(tail -2 /tmp/push.err)"
            sleep 6
          done
          echo "::error::Push 3 denemede basarisiz: $(tail -3 /tmp/push.err)"
          exit 1

      - name: Ozet bildirimi
        if: steps.build.outputs.status == '0'
        run: |
          python - <<'PYEOF2'
          import json
          try:
              data = json.load(open("channels.json", encoding="utf-8-sig"))
          except Exception as exc:
              print(f"::error::channels.json okunamadi: {exc}")
              raise SystemExit(1)
          groups = {}
          for ch in data.get("channels", []):
              g = ch.get("group") or "?"
              groups[g] = groups.get(g, 0) + 1
          ozet = ", ".join(f"{g}: {n}" for g, n in sorted(groups.items()))
          print(f"::notice::KANALLAR toplam={data.get('count')} "
                f"dogrulanmis={data.get('verified')} | {ozet}")
          PYEOF2

      - name: Saglik ozeti
        if: always()
        run: |
          if [ -f health_report.json ]; then
            {
              echo '### Saglik Raporu'
              echo '```json'
              cat health_report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Kaynaklar erisilemezse calisma BASARISIZ olsun
        if: steps.build.outputs.status != '0'
        run: |
          echo "::error::Liste uretilemedi; mevcut dosyalar korundu."
          # Aile bazli taniyi ek aciklamalarla raporla (run view'dan okunur)
          python - <<'EOF'
          import json
          try:
              rapor = json.load(open("health_report.json", encoding="utf-8"))
          except Exception:
              rapor = {}
          aileler = rapor.get("families") or {}
          for aile, durum in sorted(aileler.items()):
              print(f"::error::KAYNAK[{aile}] = {durum}")
          if not aileler:
              print("::error::Hicbir aile durumu yazilamadi (ag tamamen kapali olabilir).")
          nedenler = rapor.get("failure_reasons") or {}
          for neden, adet in list(sorted(nedenler.items(), key=lambda kv: -kv[1]))[:5]:
              print(f"::error::DOGRULAMA[{neden}] = {adet} yayin")
          EOF
          exit 1

      - name: Ag tanilama (ozet)
        if: steps.build.outputs.status != '0'
        run: |
          {
            echo "### Ag tanilama"
            echo '```'
            echo "Cikis IP: $(curl -4 -s --max-time 10 https://api.ipify.org || echo alinamadi)"
            for h in mahsunsports.xyz patronmutlusonistiyor.com taraftariumizle.org; do
              KOD=$(curl -4 -s -o /dev/null -w '%{http_code}' --max-time 12 \
                    -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                    "https://$h/" || echo hata)
              echo "$h -> HTTP $KOD"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
