name: HLS Proxy Dagit

# Worker'i Cloudflare'e dagitir ve adresini PLAYER_PROXY degiskenine yazar.
#
# GEREKLI AYARLAR (Settings -> Secrets and variables -> Actions):
#   Secret : CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit yetkili token)
#   Secret : CLOUDFLARE_ACCOUNT_ID
#
# Token olusturma: Cloudflare Dashboard -> My Profile -> API Tokens
#   -> Create Token -> "Edit Cloudflare Workers" sablonu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-proxy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4

      - name: Gizli anahtarlari kontrol et
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID secret olarak tanimlanmali."
            echo "Cloudflare Dashboard -> My Profile -> API Tokens -> 'Edit Cloudflare Workers'"
            exit 1
          fi

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Worker sozdizimi kontrolu
        run: node --check worker/hls-proxy.js

      - name: Dagit
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Worker adresi cikarilamadi."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker adresi: $URL"

      - name: Saglik testi
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            BODY=$(curl -fsS --max-time 15 "$URL/health" || true)
            if echo "$BODY" | grep -q "hls-proxy ok"; then
              echo "Proxy calisiyor."
              exit 0
            fi
            echo "Deneme $i basarisiz, bekleniyor..."
            sleep 6
          done
          echo "::error::Proxy saglik kontrolu basarisiz."
          exit 1

      - name: PLAYER_PROXY degiskenini guncelle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Actions degiskeni olarak kaydet; liste uretimi bunu kullanir.
          if gh variable set PLAYER_PROXY --body "$URL" 2>/dev/null; then
            echo "PLAYER_PROXY = $URL"
          else
            echo "::warning::PLAYER_PROXY otomatik yazilamadi (token yetkisi yok)."
            echo "Elle ekleyin: Settings -> Variables -> Actions -> PLAYER_PROXY = $URL"
          fi

      - name: Ozet
        run: |
          {
            echo "### HLS Proxy dagitildi"
            echo ""
            echo "**Adres:** ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Sitede Ayarlar (kalkan simgesi) -> bu adresi yapistirin."
          } >> "$GITHUB_STEP_SUMMARY"
